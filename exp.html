<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>표현 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1F4F3;
    --card: #FBFCFB;
    --ink: #1E2A28;
    --muted: #677875;
    --faint: #9CAAA7;
    --line: #D7E0DD;
    --accent: #2E6E63;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEAE6;
    --accent2: #B5752B;
    --accent2-soft: #F3E6D3;
    --danger: #A3402F;
    --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14191A; --card: #1B2220; --ink: #E6ECEA; --muted: #93A19D;
      --faint: #56635F; --line: #2B3734; --accent: #6FBBAC; --accent-ink: #0E1A18;
      --accent-soft: #223733; --danger: #E2897B;
      --accent2: #E0AA6A; --accent2-soft: #3A2E1D;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14191A; --card: #1B2220; --ink: #E6ECEA; --muted: #93A19D;
    --faint: #56635F; --line: #2B3734; --accent: #6FBBAC; --accent-ink: #0E1A18;
    --accent-soft: #223733; --danger: #E2897B;
    --accent2: #E0AA6A; --accent2-soft: #3A2E1D;
  }

  html, body { overflow-x: hidden; }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 28px 20px 96px; }
  [hidden] { display: none !important; }

  h1 { font-family: var(--serif); font-weight: 700; font-size: 29px; letter-spacing: -0.01em; margin: 0; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .muted { color: var(--muted); font-size: 14px; }

  /* Tabs */
  .tabs-bar { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .all-btn {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 42px; border: 0; border-right: 1px solid var(--line); border-radius: 0;
    background: transparent; color: var(--muted); padding: 0;
  }
  .all-btn:hover { color: var(--accent); background: var(--accent-soft); }
  .all-btn svg { width: 19px; height: 19px; }

  .picker {
    position: fixed; inset: 0; z-index: 50; background: rgba(20,20,16,.45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .picker[hidden] { display: none; }
  .picker-sheet {
    width: 100%; max-width: 520px; max-height: 82vh; background: var(--card);
    border-radius: 16px 16px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: flex; flex-direction: column; gap: 10px;
  }
  .picker-head { display: flex; align-items: center; justify-content: space-between; font-family: var(--serif); font-size: 17px; font-weight: 700; }
  .picker-close { border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 2px 6px; color: var(--muted); }
  .picker-body { display: flex; gap: 8px; overflow: hidden; flex: 1; min-height: 0; }
  .picker-list { flex: 1; overflow-y: auto; min-height: 0; }
  .picker-group-label { font-family: var(--serif); font-weight: 700; color: var(--accent); font-size: 13px; padding: 10px 4px 4px; position: sticky; top: 0; background: var(--card); }
  .picker-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 10px 8px;
    background: transparent; color: var(--ink); font-family: var(--serif); font-size: 15px;
  }
  .picker-item:hover { background: var(--accent-soft); }
  .picker-item[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
  .picker-item .pc { color: var(--muted); font-family: var(--sans); font-size: 12px; font-weight: 400; flex-shrink: 0; }
  .picker-add {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
    border: 0; border-radius: 6px; padding: 10px 8px; margin-top: 6px;
    background: transparent; color: var(--accent); font-size: 14px; font-weight: 500;
  }
  .picker-add:hover { background: var(--accent-soft); }
  .picker-empty { padding: 24px 8px; text-align: center; color: var(--muted); font-size: 14px; }
  .picker-index {
    flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
    padding-left: 4px; border-left: 1px solid var(--line);
  }
  .picker-index button {
    border: 0; background: transparent; color: var(--faint); font-family: var(--serif); font-weight: 700;
    font-size: 12px; padding: 3px 6px; border-radius: 4px; min-width: 26px;
  }
  .picker-index button:hover { color: var(--accent); background: var(--accent-soft); }
  .picker-index button.off { opacity: .35; pointer-events: none; }

  .tabs {
    position: relative; display: flex; overflow-x: auto; overflow-y: hidden; flex: 1; min-width: 0;
    scrollbar-width: thin; touch-action: pan-x; -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }
  .tab {
    flex-shrink: 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 11px 16px; margin-bottom: -1px; border-bottom: 3px solid transparent;
    color: var(--muted); font-size: 15px; font-weight: 500; text-decoration: none;
    font-family: var(--serif);
  }
  .tab:hover { color: var(--ink); background: var(--accent-soft); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
  .tab.add {
    position: sticky; right: 0; margin-left: auto; background: var(--paper);
    color: var(--accent); border-left: 1px solid var(--line); font-family: var(--sans); font-weight: 500;
  }
  .tab.add:hover { background: var(--accent-soft); }
  .intro { margin: 0 0 16px; color: var(--muted); font-size: 14px; }

  /* Panels / forms */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; display: grid; gap: 14px; margin-bottom: 8px;
  }
  .panel.editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="search"], textarea {
    width: 100%; min-width: 0; max-width: 100%; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 92px; line-height: 1.75; font-family: var(--serif); }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:focus-visible, textarea:focus-visible { outline-offset: 0; border-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .check-row input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .group-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 22px 0 2px; }
  .group-title:first-child { margin-top: 0; }
  .group-title.self { color: var(--accent2); }
  .error { color: var(--danger); font-size: 13px; min-height: 1em; }

  button {
    font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
    border-radius: 6px; padding: 9px 18px; border: 1px solid var(--line);
    background: transparent; color: var(--ink);
  }
  button:hover { border-color: var(--faint); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.06); }
  button.small { padding: 4px 10px; font-size: 13px; }
  button.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }

  /* Source autocomplete */
  .ac { position: relative; }
  .ac-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15;
    margin: 0; padding: 4px; list-style: none; max-height: 240px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.14);
  }
  .ac-list[hidden] { display: none; }
  .ac-list li { padding: 9px 12px; border-radius: 4px; cursor: pointer; overflow-wrap: anywhere; font-size: 14px; }
  .ac-list li:hover, .ac-list li.active { background: var(--accent-soft); }
  .ac-list .ac-head { padding: 6px 12px 2px; font-size: 11px; color: var(--muted); cursor: default; }
  .ac-list .ac-head:hover { background: transparent; }

  /* Entry view */
  .expr-head { margin-bottom: 16px; }
  .expr-head h1 { font-size: 25px; overflow-wrap: anywhere; }
  .expr-head .tools { margin-top: 10px; display: flex; gap: 6px; }

  .list-tools { margin: 24px 0 4px; display: flex; align-items: center; gap: 12px; }
  .list-tools input { flex: 1; }
  .list-tools .n { color: var(--muted); font-size: 14px; white-space: nowrap; }

  .sent { padding: 18px 0; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 6px; }
  .sent:last-child { border-bottom: 0; }
  .sent-main { flex: 1; min-width: 0; }
  .sent-text {
    cursor: pointer; margin: 0; padding-left: 14px; border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: 16px; line-height: 1.8;
    white-space: pre-wrap; overflow-wrap: anywhere; max-width: 60ch;
  }
  .sent-text:not(.open) { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .sent-text:hover { background: var(--accent-soft); }
  .sent-text.self { border-left-color: var(--accent2); }
  .sent-text.self:hover { background: var(--accent2-soft); }
  .sent-source { margin: 8px 0 0 17px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; max-width: 58ch; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 2px; padding: 0 1px; }

  .more-wrap { position: relative; flex-shrink: 0; }
  .more {
    width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; color: var(--muted);
  }
  .more:hover, .more[aria-expanded="true"] { background: var(--accent-soft); color: var(--ink); }
  .more svg { width: 19px; height: 19px; fill: currentColor; }
  .menu {
    position: absolute; right: 0; top: 100%; z-index: 20; min-width: 128px;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.14);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: block; width: 100%; text-align: left; border: 0; border-radius: 4px;
    padding: 10px 12px; font-size: 15px; background: transparent;
  }
  .menu button:hover { background: var(--accent-soft); }
  .menu button.danger { color: var(--danger); }
  .menu button.danger.armed { background: var(--danger); color: #fff; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); z-index: 30;
    background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 14px;
  }
  .toast[hidden] { display: none; }

  .empty { margin-top: 24px; padding: 32px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

  .dl { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 12px; font-size: 14px; color: var(--muted); }
  .dl p { margin: 0; }
  details.backup summary { cursor: pointer; }
  details.backup .inner { margin-top: 12px; display: grid; gap: 10px; }
  details.backup textarea { font-size: 13px; min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .expr-head h1 { font-size: 21px; }
    .sent-text { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>표현 모음</h1>
    <span class="muted" id="home-count"></span>
  </div>

  <div class="tabs-bar">
    <button type="button" class="all-btn" id="all-btn" aria-haspopup="dialog" title="전체 표현 보기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h12a1 1 0 0 1 1 1v14"/><path d="M4 19a2 2 0 0 0 2 2h13"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>
    </button>
    <nav class="tabs" id="tabs" role="tablist" aria-label="표현"></nav>
  </div>

  <div class="picker" id="picker" hidden role="dialog" aria-modal="true" aria-label="전체 표현">
    <div class="picker-sheet">
      <div class="picker-head">
        <span>전체 표현</span>
        <button type="button" class="picker-close" id="picker-close" aria-label="닫기">×</button>
      </div>
      <input type="search" id="picker-q" placeholder="표현 검색" aria-label="표현 검색">
      <div class="picker-body">
        <div class="picker-list" id="picker-list"></div>
        <nav class="picker-index" id="picker-index" aria-label="자음 색인"></nav>
      </div>
    </div>
  </div>

  <!-- 표현 추가 -->
  <section id="view-add" hidden>
    <p class="intro">표현을 추가하면 위쪽에 탭으로 나타나요. 탭을 눌러 그 표현이 쓰인 문장을 모을 수 있어요.</p>
    <div class="panel" id="expr-form">
      <div>
        <label for="e-title">표현</label>
        <input type="text" id="e-title" autocomplete="off" placeholder="예: 걸어가는 표현">
      </div>
      <div class="error" id="e-err" role="alert"></div>
      <div class="row"><button class="primary" id="e-add">표현 추가</button></div>
    </div>
  </section>

  <!-- 표현 하나 -->
  <section id="view-expr" hidden>
    <div class="expr-head">
      <h1 id="ex-title"></h1>
      <div class="tools">
        <button class="small" id="ex-edit-btn">표현 수정</button>
        <button class="small danger" id="ex-del-btn">표현 삭제</button>
      </div>
    </div>

    <div class="panel" id="expr-edit" hidden>
      <div>
        <label for="ee-title">표현</label>
        <input type="text" id="ee-title" autocomplete="off">
      </div>
      <div class="error" id="ee-err" role="alert"></div>
      <div class="row">
        <button class="primary" id="ee-save">정보 저장</button>
        <button id="ee-cancel">취소</button>
      </div>
    </div>

    <div class="panel" id="s-form">
      <div>
        <label for="s-text">이 표현이 쓰인 문장</label>
        <textarea id="s-text" placeholder="이 표현을 만난 문장을 입력하거나 붙여넣기"></textarea>
      </div>
      <div>
        <label for="s-source">출처</label>
        <div class="ac">
          <input type="text" id="s-source" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="src-list" aria-autocomplete="list" placeholder="예: 한강, 『소년이 온다』 p.52 / 기사 제목">
          <ul class="ac-list" id="src-list" role="listbox" hidden></ul>
        </div>
      </div>
      <label class="check-row"><input type="checkbox" id="s-self"> 내가 직접 쓴 문장이에요</label>
      <div class="error" id="s-err" role="alert"></div>
      <div class="row">
        <button class="primary" id="s-save">문장 저장</button>
        <button id="s-cancel" hidden>수정 취소</button>
      </div>
    </div>

    <div class="list-tools">
      <input type="search" id="s-q" placeholder="이 표현의 문장 검색" aria-label="문장 검색">
      <span class="n" id="s-count"></span>
    </div>
    <div id="sentences"></div>
  </section>

  <div class="dl">
    <p>모든 표현과 문장을 파일로 내려받아요.</p>
    <div class="row">
      <button id="dl-csv">엑셀용 (CSV)</button>
      <button id="dl-json">백업용 (JSON)</button>
      <span id="dl-msg" role="status"></span>
    </div>
    <details class="backup">
      <summary>백업 · 복원</summary>
      <div class="inner">
        <p>내용은 지금 쓰는 브라우저에만 저장돼요. 다른 기기로 옮기거나 안전하게 보관하려면 내용을 복사해 두세요.</p>
        <textarea id="backup-text" placeholder="내보내기를 누르면 여기에 내용이 나타나요. 복원할 때는 백업(JSON) 내용을 여기에 붙여넣으세요."></textarea>
        <div class="row">
          <button id="export">내보내기</button>
          <button id="import">불러오기 (합치기)</button>
          <span id="backup-msg" role="status"></span>
        </div>
      </div>
    </details>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  var KEY = "my-expression-collection-v1";
  var data = { expressions: [], sentences: [] };
  var collator = new Intl.Collator("ko");
  var editingSentence = null;
  var currentExpr = null;
  var currentTab = null; // "add" 또는 표현 id
  var sentOpen = {};
  var KEY_LAST = KEY + "-last";

  function $(id) { return document.getElementById(id); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.expressions) && Array.isArray(d.sentences)) data = d;
      }
    } catch (e) { data = { expressions: [], sentences: [] }; }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }
  function saveOrWarn(errId) {
    if (!persist()) $(errId).textContent = "이 브라우저에서는 저장할 수 없어요. 아래 백업 · 복원으로 내용을 따로 보관해 주세요.";
  }

  /* ---------- helpers ---------- */
  function getExpr(id) { return data.expressions.filter(function (x) { return x.id === id; })[0]; }
  function countOf(id) { return data.sentences.filter(function (s) { return s.exprId === id; }).length; }
  function sortedExprs() { return data.expressions.slice().sort(function (a, b) { return collator.compare(a.title, b.title); }); }

  var RECENT_LIMIT = 6;
  function recentExprs() {
    var sorted = data.expressions.slice().sort(function (a, b) { return (b.lastOpened || b.created || 0) - (a.lastOpened || a.created || 0); });
    if (currentExpr) {
      var cur = getExpr(currentExpr);
      sorted = sorted.filter(function (e) { return e.id !== currentExpr; });
      if (cur) sorted.unshift(cur);
    }
    return sorted.slice(0, RECENT_LIMIT);
  }
  function sortedSentences(list) { return list.slice().sort(function (a, b) { return (b.created || 0) - (a.created || 0); }); }

  function highlight(el, text, term) {
    el.textContent = "";
    if (!term) { el.textContent = text; return; }
    var lower = text.toLowerCase(), t = term.toLowerCase(), pos = 0, idx;
    while ((idx = lower.indexOf(t, pos)) > -1) {
      if (idx > pos) el.appendChild(document.createTextNode(text.slice(pos, idx)));
      var m = document.createElement("mark");
      m.textContent = text.slice(idx, idx + t.length);
      el.appendChild(m);
      pos = idx + t.length;
    }
    if (pos < text.length) el.appendChild(document.createTextNode(text.slice(pos)));
  }
  function armDelete(btn, label, armedLabel, action) {
    btn.addEventListener("click", function () {
      if (btn.classList.contains("armed")) { action(); }
      else {
        btn.classList.add("armed"); btn.textContent = armedLabel;
        setTimeout(function () { btn.classList.remove("armed"); btn.textContent = label; }, 3000);
      }
    });
  }
  function closeMenus() {
    var menus = document.querySelectorAll(".menu");
    for (var i = 0; i < menus.length; i++) {
      menus[i].hidden = true;
      var d = menus[i].querySelector("button.danger");
      if (d) { d.classList.remove("armed"); d.textContent = "삭제"; }

  /* ---------- tabs / routing ---------- */
  function route(initial) {

    else if (h.indexOf("#e-") === 0 && getExpr(h.slice(3))) tab = h.slice(3);
    if (!tab) {
      var last = null;
      try { last = localStorage.getItem(KEY_LAST); } catch (e) {}
      if (last && getExpr(last)) tab = last;
      else if (data.expressions.length) tab = sortedExprs()[0].id;

    }
    currentTab = tab;
    currentExpr = tab === "add" ? null : tab;
    if (currentExpr) {
      try { localStorage.setItem(KEY_LAST, currentExpr); } catch (e) {}
      var ce = getExpr(currentExpr);

    var l = sel.offsetLeft, r = l + sel.offsetWidth;

  function renderExpr() {

  /* ---------- 전체 표현 보기 (자음 색인 + 검색) ---------- */
  var CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  var JAMO_BASE = { "ㄲ": "ㄱ", "ㄸ": "ㄷ", "ㅃ": "ㅂ", "ㅆ": "ㅅ", "ㅉ": "ㅈ" };
  var PICKER_GROUPS = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ","기타"];

  function exprInitial(title) {
    var c = (title || "").trim().charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) {
      var cho = CHO[Math.floor((c - 0xAC00) / 588)];
      return JAMO_BASE[cho] || cho;
    }
    if (c >= 0x3131 && c <= 0x314E) {
      var ch = title.trim().charAt(0);
      return JAMO_BASE[ch] || (PICKER_GROUPS.indexOf(ch) > -1 ? ch : "기타");
    }
    return "기타";
  }

  function openPicker() {
    $("picker-q").value = "";
    renderPicker();
    $("picker").hidden = false;
    $("picker-q").focus();
  }
  function closePicker() { $("picker").hidden = true; }

  function renderPicker() {
    var term = $("picker-q").value.trim();
    var t = term.toLowerCase();
    var all = sortedExprs();
    var shown = all.filter(function (e) { return !t || e.title.toLowerCase().indexOf(t) > -1; });

    var buckets = {};
    PICKER_GROUPS.forEach(function (g) { buckets[g] = []; });
    shown.forEach(function (e) { buckets[exprInitial(e.title)].push(e); });

    var idx = $("picker-index");
    idx.textContent = "";
    PICKER_GROUPS.forEach(function (g) {
      var btn = document.createElement("button");
      btn.type = "button"; btn.textContent = g;
      if (buckets[g].length) {
        btn.addEventListener("click", function () {
          var el = document.getElementById("pg-" + PICKER_GROUPS.indexOf(g));
          if (el) el.scrollIntoView({ block: "start" });
        });
      } else { btn.className = "off"; btn.disabled = true; }
      idx.appendChild(btn);
    });

    var list = $("picker-list");
    list.textContent = "";
    if (!shown.length) {
      var empty = document.createElement("div");
      empty.className = "picker-empty";
      empty.textContent = all.length ? "검색 결과가 없어요." : "아직 등록한 표현이 없어요.";
      list.appendChild(empty);
    } else {
      PICKER_GROUPS.forEach(function (g, gi) {
        var arr = buckets[g];
        if (!arr.length) return;
        var label = document.createElement("div");
        label.className = "picker-group-label"; label.id = "pg-" + gi; label.textContent = g;
        list.appendChild(label);
        arr.forEach(function (e) {
          var item = document.createElement("button");
          item.type = "button"; item.className = "picker-item";
          if (e.id === currentTab) item.setAttribute("aria-current", "true");
          var left = document.createElement("span"); left.textContent = e.title;
          var right = document.createElement("span"); right.className = "pc"; right.textContent = countOf(e.id) + "개";
          item.appendChild(left); item.appendChild(right);
          item.addEventListener("click", function () { closePicker(); location.hash = "#e-" + e.id; });
          list.appendChild(item);
        });
      });
    }
    var addBtn = document.createElement("button");
    addBtn.type = "button"; addBtn.className = "picker-add";
    addBtn.innerHTML = '<span style="font-size:16px">+</span> 새 표현 추가';
    addBtn.addEventListener("click", function () { closePicker(); location.hash = "#add"; });
    list.appendChild(addBtn);
  }

  $("all-btn").addEventListener("click", openPicker);

  /* ---------- expressions ---------- */
  function addExpr() {
    var title = $("e-title").value.trim();
    if (!title) { $("e-err").textContent = "표현을 입력해 주세요."; $("e-title").focus(); return; }

    var e = { id: newId(), title: title, created: Date.now() };
    data.expressions.push(e);

    location.hash = "#e-" + e.id;
  }

  /* ---------- sentences ---------- */
  function resetSentenceForm() {
    editingSentence = null;
    $("s-text").value = ""; $("s-source").value = ""; $("s-self").checked = false;
    $("s-form").classList.remove("editing");

  function saveSentence() {
    var text = $("s-text").value.trim();
    var source = $("s-source").value.trim();
    var self = $("s-self").checked;
    if (!text) { $("s-err").textContent = "문장을 입력해 주세요."; $("s-text").focus(); return; }
    $("s-err").textContent = "";
    if (editingSentence) {
      data.sentences.forEach(function (s) { if (s.id === editingSentence) { s.text = text; s.source = source; s.self = self; } });
    } else {
      data.sentences.push({ id: newId(), exprId: currentExpr, text: text, source: source, self: self, created: Date.now() });
    }

  function startEditSentence(id) {

    if (!s) return;
    editingSentence = id;

    $("s-form").classList.add("editing");

    $("s-form").scrollIntoView({ block: "center" });
    $("s-text").focus();
  }

  /* ---------- 출처 자동완성 ---------- */
  var acList = $("src-list"), acItems = [], acActive = -1;
  function norm(t) { return String(t).toLowerCase().replace(/\s+/g, ""); }
  function sourceHistory() {
    var latest = {};
    data.sentences.forEach(function (s) {
      var src = (s.source || "").trim();
      if (!src) return;
      var t = s.updated || s.created || 0;
      if (latest[src] === undefined || latest[src] < t) latest[src] = t;
    });
    return Object.keys(latest).sort(function (a, b) { return latest[b] - latest[a]; });
  }
  function acMatches() {
    var raw = $("s-source").value.trim();
    var all = sourceHistory();
    if (!raw) return { list: all.slice(0, 6), recent: true };
    var q = norm(raw);
    var contiguous = [], scattered = [];
    all.forEach(function (src) {
      var n = norm(src);
      if (n === q) return;
      if (n.indexOf(q) > -1) { contiguous.push(src); return; }
      var chars = q.split("");
      var allIn = chars.length >= 2 && chars.every(function (c) { return n.indexOf(c) > -1; });
      if (allIn) scattered.push(src);
    });
    return { list: contiguous.concat(scattered).slice(0, 6), recent: false };
  }
  function acClose() {
    acList.hidden = true; acList.textContent = ""; acItems = []; acActive = -1;
    $("s-source").setAttribute("aria-expanded", "false");
  }
  function acPick(src) { $("s-source").value = src; acClose(); $("s-source").focus(); }
  function acSetActive(i) {
    acActive = i;
    acItems.forEach(function (li, k) { li.classList.toggle("active", k === i); });
    if (acItems[i]) acItems[i].scrollIntoView({ block: "nearest" });
  }
  function acRender() {
    var r = acMatches();
    acList.textContent = ""; acItems = []; acActive = -1;
    if (!r.list.length) { acList.hidden = true; $("s-source").setAttribute("aria-expanded", "false"); return; }
    if (r.recent) {
      var head = document.createElement("li");
      head.className = "ac-head"; head.setAttribute("role", "presentation");
      head.textContent = "최근 쓴 출처";
      acList.appendChild(head);
    }
    r.list.forEach(function (src) {
      var li = document.createElement("li");
      li.setAttribute("role", "option"); li.textContent = src;
      li.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
      li.addEventListener("click", function () { acPick(src); });
      acList.appendChild(li); acItems.push(li);
    });
    acList.hidden = false;
    $("s-source").setAttribute("aria-expanded", "true");
  }
  $("s-source").addEventListener("input", acRender);
  $("s-source").addEventListener("focus", acRender);
  $("s-source").addEventListener("blur", function () { setTimeout(acClose, 120); });
  $("s-source").addEventListener("keydown", function (e) {
    if (acList.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); acSetActive((acActive + 1) % acItems.length); }
    else if (e.key === "ArrowUp") { e.preventDefault(); acSetActive((acActive - 1 + acItems.length) % acItems.length); }
    else if (e.key === "Escape") { acClose(); }
    else if (e.key === "Enter" && acActive >= 0) { e.preventDefault(); e.stopImmediatePropagation(); acPick(acItems[acActive].textContent); }
  });

  /* ---------- download ---------- */
  function csvCell(v) { return '"' + String(v == null ? "" : v).replace(/\r?\n/g, "\n").replace(/"/g, '""') + '"'; }
  function buildCsv() {
    var rows = [["표현", "구분", "문장", "출처"]];
    sortedExprs().forEach(function (e) {
      sortedSentences(data.sentences.filter(function (s) { return s.exprId === e.id; })).forEach(function (s) {
        rows.push([e.title, s.self ? "내가 씀" : "모음", s.text, s.source || ""]);
      });
    });
    return "\uFEFF" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
  }
  function dlMsg(m) { $("dl-msg").textContent = m || ""; }
  function saveFile(filename, content, mime) {
    if (!data.sentences.length) { dlMsg("저장된 문장이 아직 없어요."); return; }
    try {
      var url = URL.createObjectURL(new Blob([content], { type: mime }));
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      dlMsg("저장했어요. 다운로드 폴더를 확인해 보세요.");
    } catch (err) { dlMsg("저장하지 못했어요. 아래 백업 · 복원으로 내용을 복사해 두세요."); }
  }
  $("dl-csv").addEventListener("click", function () { saveFile("표현 모음.csv", buildCsv(), "text/csv;charset=utf-8"); });
  $("dl-json").addEventListener("click", function () { saveFile("표현 모음 백업.json", JSON.stringify(data, null, 2), "application/json"); });

  /* ---------- backup ---------- */
  function backupMsg(m) { $("backup-msg").textContent = m; }
  $("export").addEventListener("click", function () {
    var ta = $("backup-text");
    ta.value = JSON.stringify(data, null, 2);
    ta.focus(); ta.select();
    backupMsg("내용을 전체 복사해서 메모장 등에 보관하세요.");
  });
  $("import").addEventListener("click", function () {
    var raw = $("backup-text").value.trim();
    if (!raw) { backupMsg("붙여넣은 내용이 없어요."); return; }
    try {
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.expressions) || !Array.isArray(d.sentences)) throw new Error("형식 오류");
      var haveE = {}, haveS = {};
      data.expressions.forEach(function (e) { haveE[e.id] = true; });
      data.sentences.forEach(function (s) { haveS[s.id] = true; });
      var ne = 0, ns = 0;
      d.expressions.forEach(function (e) {
        if (e && typeof e.title === "string" && e.title.trim() && e.id && !haveE[e.id]) {
          data.expressions.push({ id: e.id, title: e.title.trim(), created: e.created || Date.now() });
          haveE[e.id] = true; ne++;
        }
      });
      d.sentences.forEach(function (s) {
        if (s && typeof s.text === "string" && s.text.trim() && s.id && !haveS[s.id] && haveE[s.exprId]) {
          data.sentences.push({ id: s.id, exprId: s.exprId, text: s.text, source: typeof s.source === "string" ? s.source : "", self: !!s.self, created: s.created || Date.now() });
          haveS[s.id] = true; ns++;
        }
      });
      persist(); render();
      backupMsg("표현 " + ne + "개, 문장 " + ns + "개를 추가했어요.");
    } catch (e) {
      backupMsg("내용을 읽을 수 없어요. 내보내기로 받은 내용 그대로 붙여넣었는지 확인해 주세요.");
    }
  });

  /* ---------- events ---------- */

    location.hash = rest.length ? "#e-" + rest[0].id : "#add";
  });

  $("s-save").addEventListener("click", saveSentence);
  $("s-cancel").addEventListener("click", resetSentenceForm);
  $("s-q").addEventListener("input", renderExpr);
  $("s-text").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveSentence(); }
  });

  window.addEventListener("hashchange", function () {
    resetSentenceForm(); $("s-q").value = ""; $("expr-edit").hidden = true; closePicker(); route(false);
  });

  load();
  route(true);
})();
</script>
</body>
</html>
